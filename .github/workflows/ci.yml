name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Rust toolchain
        run: rustup show active-toolchain
      - name: Install image decoder for project gate tests
        run: python3 -m pip install -r skills/omarchy-theme-scaffold/scripts/requirements-media.txt
      - name: Test bundle
        run: ./scripts/test
      - name: Verify current upstream contract bytes
        run: python3 scripts/check_contracts.py --live
      - name: Verify reproducible packages
        run: |
          python3 scripts/package.py --output-dir dist/first
          python3 scripts/package.py --output-dir dist/second
          diff -r dist/first dist/second

  claude-evaluation-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install R for exact synthetic analysis
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends r-base-core
      - name: Synthetic evaluation pipeline only (no provider credentials)
        run: python3 evals/harness/test_pipeline.py -v

  claude-host-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned host (no provider credentials)
        run: docker build -f evals/harness/host/Dockerfile -t claude-eval-host .
      - name: Verify offline Rust helper in locked image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777 \
            -e CARGO_HOME=/tmp/cargo-home -e CARGO_TARGET_DIR=/tmp/cargo-target -e CARGO_NET_OFFLINE=true \
            --mount type=bind,src="$PWD/skills",dst=/opt/evaluation/.claude/skills,readonly \
            claude-eval-host sh -c 'cargo run --offline --manifest-path /opt/evaluation/.claude/skills/omarchy-theme-scaffold/scripts/theme-tool/Cargo.toml -- scaffold /tmp/omarchy-scratch-theme && cargo run --offline --manifest-path /opt/evaluation/.claude/skills/omarchy-theme-scaffold/scripts/theme-tool/Cargo.toml -- check /tmp/omarchy-scratch-theme'
      - name: Record image ID and host version
        run: |
          docker image inspect claude-eval-host --format '{{.Id}}'
          docker run --rm --network none claude-eval-host claude --version
