name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Rust toolchain
        run: rustup show active-toolchain
      - name: Test bundle
        run: ./scripts/test
      - name: Verify reproducible packages
        run: |
          python3 scripts/package.py --output-dir dist/first
          python3 scripts/package.py --output-dir dist/second
          diff -r dist/first dist/second
