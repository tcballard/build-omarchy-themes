name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Rust toolchain
        run: rustup show active-toolchain
      - name: Test bundle
        run: ./scripts/test
      - name: Verify reproducible packages
        run: |
          python3 scripts/package.py --output-dir dist/first
          python3 scripts/package.py --output-dir dist/second
          diff -r dist/first dist/second
